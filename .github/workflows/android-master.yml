name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
        cache: 'gradle'
    - name: Prepare release keystore
        shell: bash
        env:
          ENCODED_KEYSTORE: ${{ secrets.ENCODEDKEYSTORE }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTOREPASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEYPASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${GITHUB_WORKSPACE}/app/keystore.jks"
          if [ -n "${ENCODED_KEYSTORE:-}" ]; then
            echo "${ENCODED_KEYSTORE}" | base64 --decode > "${KEYSTORE_PATH}" || true
          fi
          if [ -s "${KEYSTORE_PATH}" ] && keytool -list -keystore "${KEYSTORE_PATH}" -storepass "${KEYSTORE_PASSWORD_SECRET:-}" >/dev/null 2>&1; then
            echo "Using configured release keystore."
            {
              echo "KEYSTORE=keystore.jks"
              echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD_SECRET}"
              echo "KEY_ALIAS=${KEY_ALIAS_SECRET:-sam-release}"
              echo "KEY_PASSWORD=${KEY_PASSWORD_SECRET:-${KEYSTORE_PASSWORD_SECRET}}"
            } >> "${GITHUB_ENV}"
          else
            echo "::warning::Configured release keystore is missing or invalid. Generating a CI-only release key."
            rm -f "${KEYSTORE_PATH}"
            CI_PASSWORD="${GITHUB_RUN_ID}-SamRelease"
            keytool -genkeypair -v -keystore "${KEYSTORE_PATH}" -storetype JKS -storepass "${CI_PASSWORD}" -keypass "${CI_PASSWORD}" -alias sam-release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SAM Launcher,O=FGMembers,C=US"
            {
              echo "KEYSTORE=keystore.jks"
              echo "KEYSTORE_PASSWORD=${CI_PASSWORD}"
              echo "KEY_ALIAS=sam-release"
              echo "KEY_PASSWORD=${CI_PASSWORD}"
            } >> "${GITHUB_ENV}"
          fi

    - name: Download dependencies
      run: ./gradlew androidDependencies
    - name: Build release APK
      run: ./gradlew assembleOssRelease
      env:
        APPID: com.fgmembers.samlauncher
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release.apk
        path: app/build/outputs/apk/oss/release/app-oss-release.apk
